name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 24
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # The compiler and lsp builds shell out to cargo, so the toolchain has to
      # be installed rather than inherited from whatever the runner image ships.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/compiler
            packages/lsp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm run build

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # `typecheck` pulls `compiler-wasm#build` in through turbo, so this job
      # needs the same wasm toolchain the build and test jobs install.
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/compiler
            packages/lsp

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/compiler
            packages/lsp

      # The parity harness runs runtime-core's compiled Luau under Lune, pinned
      # to the release apps/parity-harness/rokit.toml names.
      - name: Install Lune
        env:
          LUNE_VERSION: 0.10.5
          LUNE_SHA256: 1fb5dee6a1afa1d300092805c6e660fe06144d29dd68c45cf6956f040667f791
        run: |
          grep -q "lune-org/lune@$LUNE_VERSION\"" apps/parity-harness/rokit.toml
          curl -fsSL -o "$RUNNER_TEMP/lune.zip" \
            "https://github.com/lune-org/lune/releases/download/v$LUNE_VERSION/lune-$LUNE_VERSION-linux-x86_64.zip"
          echo "$LUNE_SHA256  $RUNNER_TEMP/lune.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/lune.zip" -d "$RUNNER_TEMP/lune"
          lune="$(find "$RUNNER_TEMP/lune" -type f -name lune | head -n 1)"
          chmod +x "$lune"
          "$lune" --version
          echo "LUNE=$lune" >> "$GITHUB_ENV"

      # Pinned to the Rojo release both harness rokit.toml files name.
      - name: Install Rojo
        env:
          ROJO_VERSION: 7.7.0
          ROJO_SHA256: 22503e5839864f9d7c2171c48b536fc229f2cc4d8774c9cc149f60941d864073
        run: |
          grep -q "rojo-rbx/rojo@$ROJO_VERSION\"" apps/rbxts-harness/rokit.toml
          grep -q "rojo-rbx/rojo@$ROJO_VERSION\"" apps/vide-harness/rokit.toml
          curl -fsSL -o "$RUNNER_TEMP/rojo.zip" \
            "https://github.com/rojo-rbx/rojo/releases/download/v$ROJO_VERSION/rojo-$ROJO_VERSION-linux-x86_64.zip"
          echo "$ROJO_SHA256  $RUNNER_TEMP/rojo.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/rojo"
          rojo="$(find "$RUNNER_TEMP/rojo" -type f -name rojo | head -n 1)"
          chmod +x "$rojo"
          "$rojo" --version
          dirname "$rojo" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

      - name: Build the Studio bench places
        run: |
          pnpm --filter rbxts-harness run bench:place
          pnpm --filter vide-harness run bench:place

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/compiler
            packages/lsp

      # The two crates are separate cargo roots, so every step runs twice
      # instead of once over a shared workspace.
      - name: Check formatting
        run: |
          cargo fmt --manifest-path packages/compiler/Cargo.toml --check
          cargo fmt --manifest-path packages/lsp/Cargo.toml --check

      - name: Run clippy
        run: |
          cargo clippy --manifest-path packages/compiler/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path packages/lsp/Cargo.toml --all-targets -- -D warnings

      - name: Run tests
        run: |
          cargo test --manifest-path packages/compiler/Cargo.toml
          cargo test --manifest-path packages/lsp/Cargo.toml

      # One pass per bench, so they keep running without timing anything.
      - name: Check benches
        run: cargo bench --manifest-path packages/compiler/Cargo.toml -- --test
