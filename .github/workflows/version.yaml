name: Version

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  pull-requests: write

env:
  NODE_VERSION: 24

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Opens/refreshes a release PR while changesets are pending. Once that PR
      # lands there are none left, and the steps below cut and publish the tag.
      - name: Create release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A landed release PR is the only thing that moves the root version, so
      # comparing against the previous tip recognises it under any merge method.
      # Matching the commit message instead would miss a merge commit, and the
      # absence of changesets alone would release on any ordinary push to main.
      - name: Tag release
        id: tag
        if: ${{ steps.changesets.outputs.hasChangesets == 'false' }}
        run: |
          version="$(pnpm -s release:current-version)"
          tag="v${version}"
          previous="$(git show HEAD~1:package.json | node -pe "JSON.parse(require('node:fs').readFileSync(0, 'utf8')).version")"

          if [ "${version}" = "${previous}" ]; then
            echo "Root version is unchanged at ${version}; nothing to release."
            exit 0
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; nothing to release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"
          echo "Pushed ${tag}."

          echo "release_tag=${tag}" >> "${GITHUB_OUTPUT}"

      # A tag pushed with GITHUB_TOKEN raises no `push` event, so publish.yaml
      # has to be started explicitly. `workflow_dispatch` through the API is the
      # documented exception to that rule and needs no separate PAT.
      - name: Start publish
        if: ${{ steps.tag.outputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.release_tag }}
        run: |
          case "${RELEASE_TAG}" in
            *-*) npm_tag="next" ;;
            *) npm_tag="latest" ;;
          esac

          gh workflow run publish.yaml \
            --ref "${RELEASE_TAG}" \
            -f release_tag="${RELEASE_TAG}" \
            -f npm_tag="${npm_tag}" \
            -f dry_run=false \
            -f publish_vscode_extension=true

          echo "Dispatched publish.yaml for ${RELEASE_TAG} on the ${npm_tag} dist-tag."
