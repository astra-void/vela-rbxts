packages:
  - "apps/*"
  - "packages/*"

# roblox-ts and Rojo resolve `@rbxts*` packages by walking real directories, so
# the symlinked default layout hides them. A nested .npmrc cannot set this —
# pnpm only reads node-linker from the workspace root.
nodeLinker: hoisted

allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true

# Security floors only. Each entry stays inside the major its dependents
# declare: an override that crosses a major swaps in an incompatible API and
# breaks the tool at runtime rather than at install time.
overrides:
  brace-expansion: ">=5.0.12"
  minimatch@1>brace-expansion: "^1.1.18"
  minimatch@3>brace-expansion: "^1.1.18"
  minimatch@5>brace-expansion: "^2.1.4"
  minimatch@6>brace-expansion: "^2.1.4"
  minimatch@7>brace-expansion: "^2.1.4"
  minimatch@8>brace-expansion: "^2.1.4"
  minimatch@9>brace-expansion: "^2.1.4"
  esbuild: ">=0.28.1"
  fast-uri: ">=4.0.0"
  ajv>fast-uri: "^3.1.9"
  js-yaml: "^4.3.2"
  read-yaml-file>js-yaml: "^3.15.2"
  qs: ">=6.16.1"
  vite: ">=8.1.6"
  nanoid@3: "^3.3.18"
  postcss: ">=8.5.23"
  source-map-js: ">=1.2.2"
