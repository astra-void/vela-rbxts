[package]
name = "vela-rbxts-lsp"
version = "0.4.2"
edition = "2024"
description = "Standalone stdio LSP adapter over the vela-rbxts compiler APIs."
license = "MIT"
repository = "https://github.com/astra-void/vela-rbxts"
publish = false

[dependencies]
tower-lsp = "0.20"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vela-rbxts-compiler = { path = "../compiler" }

